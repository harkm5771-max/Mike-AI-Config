version: 1.3.15
cache: true

memory:
  disabled: false
  personalize: true
  tokenLimit: 3000
  maxInputTokens: 12000
  messageWindowSize: 8
  validKeys:
    - user_preferences
    - personal_context
    - ongoing_projects
    - learned_facts
  agent:
    enabled: true
    provider: openAI
    model: gpt-5.6-luna
version: 1.3.16
cache: true

memory:
  disabled: false
  personalize: true
  tokenLimit: 3000
  charLimit: 10000
  maxInputTokens: 12000
  messageWindowSize: 8

  validKeys:
    - user_preferences
    - personal_context
    - ongoing_projects
    - learned_facts

  agent:
    enabled: true
    provider: openAI
    model: gpt-4.1-mini
    instructions: |
      Maintain durable memory about the user using only the allowed keys.

      Use user_preferences for explicitly stated preferences about communication style,
      formatting, workflow, tools, or how the user wants responses handled.

      Use personal_context for stable background facts the user explicitly shares that
      are likely to matter in future conversations.

      Use ongoing_projects for active businesses, projects, goals, or recurring work
      the user is currently pursuing.

      Use learned_facts for other durable factual information explicitly stated by the user.

      Do not store trivial one-off details, temporary requests, or information that is
      unlikely to matter in future conversations.

webSearch:
  searchProvider: tavily
  scraperProvider: tavily
  rerankerType: none
  tavilyApiKey: "${TAVILY_API_KEY}"

mcpServers:
  gmail:
    type: streamable-http
    url: "https://gmailmcp.googleapis.com/mcp/v1"
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: "https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent"
      token_url: "https://oauth2.googleapis.com/token"
      client_id: "${GOOGLE_WORKSPACE_MCP_CLIENT_ID}"
      client_secret: "${GOOGLE_WORKSPACE_MCP_CLIENT_SECRET}"
      scope: "https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.compose"
      redirect_uri: "https://librechat-production-4d516.up.railway.app/api/mcp/gmail/oauth/callback"
      token_exchange_method: default_post
      token_endpoint_auth_methods_supported:
        - client_secret_post
